<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ingreso — Centro de Recursos Amauta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background: #fcfaf7;
      --foreground: #2a211a;
      --primary: #623b2a;
      --primary-foreground: #fcf9f6;
      --muted-foreground: #7c6f63;
      --accent: #cedc00;
      --border: #e4dacd;
      --input-bg: #ffffff;
      --ring: #623b2a;
      --destructive: #b3261e;
      --radius: 0.875rem;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Titillium Web', system-ui, sans-serif;
      color: var(--foreground);
      background: var(--background);
    }

    /* Layout de dos columnas */
    .amauta-shell {
      display: flex;
      min-height: 100dvh;
    }

    .amauta-form-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      padding: 2rem 1.5rem;
    }

    .amauta-inner {
      width: 100%;
      max-width: 28rem;
      margin: 0 auto;
    }

    .amauta-logo {
      height: 2rem;
      width: auto;
      color: var(--primary);
      display: block;
    }

    .amauta-heading {
      margin: 2.25rem 0 0.35rem;
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .amauta-sub {
      margin: 0 0 1.75rem;
      color: var(--muted-foreground);
      font-size: 0.95rem;
    }

    /* Panel derecho con imagen */
    .amauta-media-side {
      display: none;
      position: relative;
      width: 54%;
      background-image: linear-gradient(180deg, rgba(38,24,16,0.15), rgba(38,24,16,0.72)), url('https://recursos.amauta.ag/images/login-field.png');
      background-size: cover;
      background-position: center;
    }

    .amauta-media-copy {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3.5rem;
    }

    .amauta-tagline {
      max-width: 30rem;
      font-size: 2.5rem;
      line-height: 1.1;
      font-weight: 400;
      color: #fcf9f6;
      margin: 0;
    }

    .amauta-tagline strong {
      display: block;
      font-weight: 700;
    }

    .amauta-tagline-desc {
      margin-top: 1rem;
      max-width: 30rem;
      color: rgba(252, 249, 246, 0.8);
      font-size: 1rem;
      line-height: 1.5;
    }

    @media (min-width: 1024px) {
      .amauta-form-side { width: 46%; padding: 2.5rem 5rem; }
      .amauta-media-side { display: block; }
      .amauta-media-copy { justify-content: center; }
    }

    /* ==========================================================
       Estilos del formulario que inyecta Azure AD B2C (#api)
       ========================================================== */
    #api {
      width: 100%;
    }

    #api .intro,
    #api .intro h2 {
      display: none; /* usamos nuestro propio encabezado */
    }

    #api .localAccount { width: 100%; }

    #api .entry { width: 100%; }

    #api .entry-item {
      margin-bottom: 1rem;
    }

    #api label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--foreground);
      margin-bottom: 0.4rem;
    }

    #api input[type="text"],
    #api input[type="email"],
    #api input[type="password"] {
      width: 100%;
      height: 2.85rem;
      padding: 0 0.9rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--foreground);
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) * 0.8);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    #api input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px rgba(98, 59, 42, 0.15);
    }

    /* Enlace "olvidé mi contraseña" */
    #api #forgotPassword {
      display: inline-block;
      margin-top: 0.35rem;
      font-size: 0.85rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    #api #forgotPassword:hover { text-decoration: underline; }

    /* Botón principal */
    #api .buttons {
      margin-top: 1.5rem;
    }

    #api button,
    #api .buttons button {
      width: 100%;
      height: 2.95rem;
      font-size: 0.98rem;
      font-weight: 600;
      font-family: inherit;
      color: var(--primary-foreground);
      background: var(--primary);
      border: none;
      border-radius: calc(var(--radius) * 0.8);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.05s;
    }
    #api button:hover { opacity: 0.92; }
    #api button:active { transform: translateY(1px); }

    /* Botón secundario (si aparece) */
    #api button#cancel,
    #api .buttons button#cancel {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--border);
      margin-top: 0.6rem;
    }

    /* Mensajes de error */
    #api .error,
    #api .itemLevel .error,
    #api .pageLevel .error {
      color: var(--destructive);
      font-size: 0.82rem;
      margin-top: 0.35rem;
    }

    #api .pageLevel {
      background: rgba(179, 38, 30, 0.08);
      border: 1px solid rgba(179, 38, 30, 0.25);
      border-radius: calc(var(--radius) * 0.7);
      padding: 0.7rem 0.85rem;
      margin-bottom: 1rem;
    }

    /* Separadores y proveedores sociales (si los hubiera) */
    #api .divider {
      margin: 1.25rem 0;
      text-align: center;
      color: var(--muted-foreground);
      font-size: 0.8rem;
    }

    #api .create,
    #api .createaccount {
      margin-top: 1.25rem;
      font-size: 0.88rem;
      color: var(--muted-foreground);
      text-align: center;
    }
    #api .create a { color: var(--primary); font-weight: 600; text-decoration: none; }
    #api .create a:hover { text-decoration: underline; }
  </style>
</head>

        <h1 class="amauta-heading">Bienvenido de nuevo</h1>
        <p class="amauta-sub">Ingresá con tu cuenta para acceder al Centro de Recursos.</p>

        <!-- Azure AD B2C inyecta el formulario dentro de este contenedor -->
        <div id="api"></div>
      </div>
    </div>

    <!-- Columna de imagen -->
    <div class="amauta-media-side" aria-hidden="true">
      <div class="amauta-media-copy">
        <p class="amauta-tagline">Evolucionando<strong>la agricultura</strong></p>
        <p class="amauta-tagline-desc">Potenciamos los rindes a través de la nutrición vegetal, cuidando la salud del suelo.</p>
      </div>
    </div>
  </div>
</body>
</html>
